description: |-
  Manage Amazon MWAA Serverless resources in AWS from within your Kubernetes cluster.


  **About Amazon MWAA Serverless**


  Amazon Managed Workflows for Apache Airflow Serverless lets you run Apache Airflow
  workflows in AWS without provisioning or managing the underlying Airflow infrastructure.
  You define workflow code and configuration while the service manages the environment
  capacity needed to run tasks.


  **About the AWS Controllers for Kubernetes**


  This controller is a component of the [AWS Controller for Kubernetes](https://github.com/aws/aws-controllers-k8s)
  project. This project is currently in **developer preview**.


  **Pre-Installation Steps**


  Please follow the following link: [Red Hat OpenShift](https://aws-controllers-k8s.github.io/community/docs/user-docs/openshift/)
